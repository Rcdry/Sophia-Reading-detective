*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(145deg,#fff0fa,#eef8ff);color:#3d3150;min-height:100vh}button{font:inherit;touch-action:manipulation}.top{position:sticky;top:0;z-index:5;background:#fffffff2;border-bottom:2px solid #eadcff;padding:max(14px,env(safe-area-inset-top)) 18px 14px;display:flex;justify-content:space-between;gap:12px;align-items:center}.brand{font-weight:900;color:#7049a6;font-size:clamp(20px,4vw,30px)}.stats{display:flex;gap:7px;flex-wrap:wrap}.pill{background:#fff;border:2px solid #eadfff;border-radius:18px;padding:8px 11px;font-weight:800}main{padding:25px 16px 70px}.card{max-width:850px;margin:auto;background:#fff;border:2px solid #eadfff;border-radius:28px;padding:clamp(22px,5vw,40px);box-shadow:0 14px 35px #50326e1f}.center{text-align:center}h1,h2{color:#6b48a0}h1{font-size:clamp(30px,6vw,45px)}h2{font-size:clamp(25px,5vw,35px)}p{font-size:clamp(18px,3.4vw,22px);line-height:1.55}.hero{font-size:82px}.btn,.answer,.mode{width:100%;min-height:62px;border-radius:19px;padding:15px;margin:7px 0;font-weight:850;cursor:pointer}.btn{border:0;background:linear-gradient(135deg,#8b63d1,#d06fbd);color:#fff;font-size:20px}.alt{background:#f5efff;color:#60458e;border:2px solid #d8c5f5}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.mode{background:#fff;border:3px solid #e3d2fa;color:#59436f;font-size:18px}.mode b{display:block;color:#68479d;font-size:22px;margin:7px}.icon{font-size:55px}.read{font:clamp(23px,4vw,30px)/1.65 Georgia,serif;background:#fffdf6;border:3px solid #efd69c;padding:26px;border-radius:22px;margin:20px 0}.focus,.tip{padding:18px;border-radius:20px;margin:18px 0}.focus{background:#fff8d9;border:3px solid #efd267;text-align:center}.tip{background:#f5efff;border-left:6px solid #9872cf}.answers{display:grid;gap:9px}.answer{background:#fff;border:3px solid #e3d8ed;color:#44374f;text-align:left;font-size:19px}.good{background:#e8faea!important;border-color:#70c77a!important}.bad{background:#fff0f0!important;border-color:#ef9999!important}.progress{height:14px;background:#eee5f5;border-radius:15px;overflow:hidden;margin:8px 0 22px}.progress div{height:100%;background:linear-gradient(90deg,#9871da,#ed91c9)}.reports{display:grid;grid-template-columns:1fr 1fr;gap:10px}.report{background:#f7f3ff;border:2px solid #e1d4f4;padding:17px;border-radius:18px;text-align:center}.report strong{display:block;font-size:29px;color:#68499e}.overlay{position:fixed;inset:0;background:#412a505c;z-index:100;display:grid;place-items:center;padding:20px}.reward{width:min(500px,94vw);background:linear-gradient(160deg,#fff,#fff0fa);border:4px solid #efbde1;border-radius:32px;padding:32px 24px;text-align:center;box-shadow:0 20px 60px #28143c4d;animation:pop .4s ease}.reward .char{font-size:95px}.hidden{display:none!important}@keyframes pop{0%{transform:scale(.55);opacity:0}75%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}@media(max-width:650px){.top{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}}

.gameHero:before,.gameHero:after{content:"✦";position:absolute;color:#ef8acb;font-size:40px;animation:twinkle 2s infinite alternate}.gameHero:before{top:15px;left:20px}.gameHero:after{right:24px;top:55px;animation-delay:.8s}.avatar{width:160px;height:160px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#ffe8f7 0 35%,#d9c2ff 36% 62%,#8d61c9 63%);border:6px solid white;box-shadow:0 0 0 5px #e8b4ef,0 12px 25px #6d43912b;font-size:90px;position:relative}.avatar:after{content:"🐱";position:absolute;font-size:55px;right:-20px;bottom:-8px;background:white;border-radius:50%;padding:5px;border:3px solid #efc7ec}.rank{display:inline-block;background:linear-gradient(90deg,#7044b4,#d45cae);color:white;border-radius:999px;padding:7px 15px;font-weight:900;letter-spacing:.3px}.missionBanner{background:linear-gradient(90deg,#ffd869,#ff9bcf);border:3px solid #fff;border-radius:22px;padding:14px;margin:18px 0;font-weight:900;color:#603a74;box-shadow:0 5px 0 #dba2ce}.gameNav{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0}.navTile{background:#fff;border:2px solid #e4d1f5;border-radius:18px;padding:12px 7px;font-weight:800;color:#63448f}.navTile span{display:block;font-size:28px}.questTag{display:inline-flex;align-items:center;gap:7px;background:#fff2c9;border:2px solid #efce6c;border-radius:999px;padding:7px 12px;font-weight:850}.companion{font-size:65px;filter:drop-shadow(0 5px 5px #70456c33)}@keyframes twinkle{to{transform:scale(1.35) rotate(20deg);opacity:.45}}@media(max-width:500px){.gameNav{grid-template-columns:1fr 1fr}.avatar{width:130px;height:130px;font-size:72px}}
</style></head><body><header class="top"><div><div class="brand">🌸🔎 Sophia's Reading Detective</div><small>✨ 30-Case Anime Adventure • Read • Think • Remember • Solve ✨</small></div><button class="pill" onclick="gameMenu()" style="cursor:pointer">☰ Menu</button><span class="pill">🪙 <b id="coins">0</b></span><span class="pill">🔥 <b id="streak">0</b></span><span class="pill">⭐ <b id="stars">0</b></span></div></header><main id="screen"></main><div id="overlay" class="overlay hidden"><div class="reward"><div id="rchar" class="char">🐱✨</div><h2 id="rtitle">Great Job!</h2><p id="rtext"></p><button class="btn" onclick="closeReward()">Keep Detecting! 🔎</button></div></div><script>
const stories=[
["The Missing Library Book",["Sophia packed her purple backpack before school. She carefully placed her library book inside the front pocket.","At school, Mrs. Green asked everyone to return their library books. Sophia opened her backpack, but the book was gone.","Sophia thought about her morning. She remembered taking out her lunchbox in the kitchen before leaving home.","After school, Sophia checked the kitchen. The library book was sitting beside the fruit bowl."],[["What color was Sophia's backpack?",["Blue","Purple","Green","Red"],1,"Detail"],["What problem did Sophia discover?",["She forgot lunch","She missed the bus","Her library book was missing","She lost her backpack"],2,"Problem"],["Why did Sophia think about her morning?",["To remember where the book might be","She wanted lunch","Her teacher told her to","She forgot school"],0,"Cause & Effect"],["Where was the library book?",["Under her bed","On the bus","Beside the fruit bowl","Inside her desk"],2,"Recall"],["What is the main idea?",["Sophia dislikes books","Sophia loses a book and uses her memory to find it","Sophia buys a backpack","Her teacher visits her house"],1,"Main Idea"]]],
["The Rainy Soccer Game",["Maya looked out the window before her soccer game. Dark clouds covered the sky, so she packed a yellow rain jacket.","During the second half, rain began falling. The players kept running even though the field became slippery.","After the game, Maya put on her rain jacket. Her dad smiled because Maya had remembered to prepare for the weather.","On the ride home, Maya felt proud. Her team had lost the game, but she had played hard and planned ahead."],[["Why did Maya pack a rain jacket?",["She saw dark clouds","It was new","She was cold inside","Her coach told her"],0,"Cause & Effect"],["What happened during the second half?",["The sun came out","The game stopped","It began to rain","Maya went home"],2,"Sequence"],["How did Maya feel afterward?",["Angry","Proud","Scared","Confused"],1,"Feeling"],["Why did Maya's dad smile?",["She scored ten goals","Rain stopped","She prepared for the weather","They won"],2,"Inference"],["What lesson fits the story?",["Winning is everything","Planning ahead can help","Never play in rain","Leave your jacket home"],1,"Main Idea"]]],
["The Garden Visitor",["Lena was watering tomato plants when she noticed a bright orange butterfly resting on a leaf.","She moved slowly so she would not scare it. The butterfly opened and closed its wings in the warm sun.","Lena called her brother, but asked him to walk quietly. Together they watched the butterfly drink nectar from a nearby flower.","A few minutes later, the butterfly flew over the fence. Lena drew a picture of it so she could remember the visit."],[["What animal did Lena see?",["Bee","Butterfly","Bird","Rabbit"],1,"Detail"],["Why did Lena move slowly?",["She was tired","The ground was wet","She did not want to scare the butterfly","Her brother was sleeping"],2,"Cause & Effect"],["What did the butterfly do near the flower?",["Built a nest","Drank nectar","Ate a tomato","Hid"],1,"Recall"],["Why did Lena draw a picture?",["For homework","To remember the visit","To sell it","Her brother asked"],1,"Inference"],["What best describes Lena?",["Careless","Observant and gentle","Angry","In a hurry"],1,"Character"]]],
["The Science Surprise",["Noah's class placed three bean seeds in clear cups near the classroom window. Each cup had soil and a little water.","Every morning Noah checked the cups. For several days, nothing seemed to change.","On Thursday, a tiny green shoot pushed through the soil in the second cup. Noah hurried to show his teacher.","The class measured the new plant and recorded its height. They planned to check it again the next morning."],[["What did the class plant?",["Flowers","Bean seeds","Grass","Tomatoes"],1,"Detail"],["Where were the cups?",["In a closet","Outside","Near the window","Under a desk"],2,"Setting"],["What changed on Thursday?",["A cup broke","A green shoot appeared","The soil disappeared","School closed"],1,"Sequence"],["Why did Noah hurry to his teacher?",["He saw the plant sprout","He was late","He needed water","He lost a cup"],0,"Cause & Effect"],["What will the class probably do next?",["Throw the plant away","Measure it again","Move schools","Eat the seed"],1,"Prediction"]]],
["The Helpful Neighbor",["A strong wind knocked several small branches into Mr. Lee's yard. He began gathering them into a pile.","Ava saw him working while she rode her bicycle. She parked her bike and asked if he needed help.","Together they carried the branches to the curb. The job went much faster with two people working.","Mr. Lee thanked Ava. Ava smiled because she had not planned to help, but she was glad she stopped."],[["What caused branches to fall?",["Rain","Strong wind","A truck","A dog"],1,"Cause & Effect"],["What was Ava doing first?",["Reading","Riding her bicycle","Cleaning","Walking a dog"],1,"Sequence"],["How did Ava help?",["She called a truck","She carried branches","She planted flowers","She swept the house"],1,"Detail"],["Why did the job go faster?",["The branches vanished","Two people worked together","It stopped being windy","Ava used a machine"],1,"Inference"],["What is the main idea?",["Helping someone can make a job easier","Never ride a bike","Wind is always dangerous","Branches grow quickly"],0,"Main Idea"]]],
["The Forgotten Lunch",["Eli arrived at school and reached into his backpack for his lunchbox. The pocket was empty.","He remembered setting the lunchbox beside the front door while tying his shoes. He realized he had walked out without it.","At lunchtime, Eli told his teacher what happened. She helped him get a school lunch for the day.","That evening, Eli placed a note on the front door that said, Check for lunch! He wanted a reminder for tomorrow."],[["What did Eli forget?",["Homework","Lunchbox","Shoes","Backpack"],1,"Detail"],["Where had he left it?",["By the front door","On the bus","At school","In his room"],0,"Recall"],["Who helped Eli?",["His friend","His teacher","The bus driver","His neighbor"],1,"Detail"],["Why did Eli make a note?",["To remember his lunch tomorrow","To decorate the door","For homework","To thank his teacher"],0,"Cause & Effect"],["What did Eli learn?",["School lunch is bad","A reminder can help prevent the same mistake","Never use a backpack","Always skip lunch"],1,"Main Idea"]]],
["The Beach Cleanup",["Nora and her family walked along the beach early Saturday morning. Near the dunes, Nora noticed an empty plastic bottle in the sand.","Her dad had brought a small trash bag, so Nora picked up the bottle. Soon they found wrappers and a broken plastic cup too.","They were careful not to disturb shells, plants, or anything that belonged naturally on the beach.","When they left, the bag was full of litter. Nora looked back and felt proud that the beach was cleaner."],[["What did Nora first notice?",["A shell","A plastic bottle","A crab","A towel"],1,"Detail"],["Why did her dad have a bag?",["To collect litter","For lunch","For shells","For wet clothes"],0,"Inference"],["What did they avoid disturbing?",["Cars","Natural things on the beach","Trash","Their shoes"],1,"Detail"],["How did Nora feel at the end?",["Proud","Angry","Bored","Scared"],0,"Feeling"],["What is the main idea?",["Beaches are only for swimming","Small actions can help care for a place","Never touch sand","Plastic belongs near dunes"],1,"Main Idea"]]],
["The New Student",["A new student named Emma joined Jayden's class on Monday. She stood quietly near the teacher's desk while everyone found their seats.","At recess, Jayden noticed Emma sitting alone on a bench. He walked over and asked if she wanted to play four square.","Emma smiled and joined the game. Soon she was laughing with Jayden and two other students.","Before going home, Emma thanked Jayden for including her. Jayden realized one small invitation had made a big difference."],[["Who was new to the class?",["Jayden","Emma","The teacher","No one"],1,"Detail"],["Where was Emma at recess?",["On a bench","In the library","At home","On the bus"],0,"Setting"],["What did Jayden ask Emma to do?",["Study","Play four square","Eat lunch","Go home"],1,"Detail"],["Why did Emma thank Jayden?",["He gave her homework","He included her","He found her bag","He taught class"],1,"Inference"],["What lesson fits the story?",["A small act of kindness can help someone feel welcome","Never talk at recess","New students dislike games","Always sit alone"],0,"Main Idea"]]]
];

const EXTRA=[["The Lost Kitten","Amelia","park","a tiny gray kitten","under a bench","heard a soft meow","animal shelter","helped the kitten get home"],["The Art Show","Zoe","school hallway","her watercolor painting","beside the library doors","saw families admiring it","art teacher","felt proud of patient practice"],["The Broken Bird Feeder","Mia","backyard","a fallen bird feeder","near the oak tree","noticed a cracked hook","her grandfather","fixed it instead of throwing it away"],["The Mystery Footprints","Lily","snowy yard","small paw prints","beside the porch","followed the trail","her brother","discovered a rabbit hiding nearby"],["The Cupcake Mix-Up","Ava","kitchen","two bowls of batter","on the counter","read the labels twice","her mom","caught a mistake before baking"],["The Library Challenge","Grace","library","a mystery novel","on the new-books shelf","read one chapter each night","the librarian","finished a longer book than she expected"],["The Missing Glove","Chloe","playground","one red glove","near the swings","remembered lending it","her friend","solved the problem by retracing her steps"],["The Class Pet","Ruby","classroom","the class hamster","inside its tunnel","noticed the water bottle was empty","her teacher","helped care for an animal responsibly"],["The Lemonade Stand","Ella","front yard","a lemonade stand","under a striped umbrella","made a price sign","her cousin","learned that planning made the job easier"],["The Music Recital","Lucy","auditorium","her piano music","on the stage","took a slow breath","her music teacher","played through her nervous feeling"],["The Camping Lantern","Hannah","campsite","a small lantern","inside the tent","checked the batteries before dark","her dad","prepared before the family needed the light"],["The Puzzle Contest","Aria","family room","a 300-piece puzzle","on the coffee table","sorted the edge pieces first","her sister","used a strategy instead of rushing"],["The School Garden","Layla","school garden","young lettuce plants","in the raised bed","noticed the soil was dry","her science teacher","gave the plants the water they needed"],["The Birthday Secret","Emma","bedroom","a handmade birthday card","inside her desk","hid it before her sister entered","her dad","kept a kind surprise secret"],["The Bike Trail","Nora","bike trail","a trail map","at the wooden sign","checked which path led home","her mom","used information before choosing a direction"],["The Tiny Turtle","Isla","pond","a tiny turtle","on a warm rock","watched from a distance","her aunt","observed wildlife without disturbing it"],["The Power Outage","Sophie","living room","a flashlight","inside the emergency drawer","remembered where it was stored","her brother","stayed calm and found what the family needed"],["The Bake Sale","Olivia","school cafeteria","a tray of cookies","at the bake-sale table","counted the change carefully","her teacher","used math to help the fundraiser"],["The Friendship Bracelet","Madison","craft table","a purple friendship bracelet","beside the bead box","started the pattern over after a mistake","her best friend","learned patience can improve her work"],["The Planet Poster","Harper","classroom","a poster about Saturn","on the presentation board","practiced explaining the rings","her partner","felt prepared when it was time to present"],["The Rainy Field Trip","Abigail","museum","a folded umbrella","inside her backpack","checked the forecast that morning","her teacher","was ready when rain started after the visit"],["The Surprise Seedling","Scarlett","windowsill","a sunflower seedling","in a painted pot","turned the pot toward the sunlight","her grandmother","helped the plant grow by noticing what it needed"]];
EXTRA.forEach((d,n)=>{const [title,girl,place,item,where,action,helper,lesson]=d;stories.push([title,[
girl+" arrived at the "+place+" and noticed "+item+" "+where+". She stopped to look carefully before deciding what to do.",
"Instead of rushing, "+girl+" "+action+". She paid attention to the details and thought about what they might mean.",
girl+" talked with "+helper+" and explained what she had noticed. Together they chose a sensible next step.",
"By the end, "+girl+" "+lesson+". She was glad she had slowed down, paid attention, and thought before acting."
],[
["Where did the story take place?",[place,"a grocery store","a train station","a beach"],0,"Setting"],
["What did "+girl+" notice?",[item,"a new bicycle","a lunch menu","a television"],0,"Detail"],
["What did "+girl+" do after noticing it?",[action,"ignored everything","ran away immediately","went to sleep"],0,"Sequence"],
["Who did "+girl+" talk with?",[helper,"a bus driver","a stranger","no one"],0,"Recall"],
["What is the best lesson from the story?",[lesson,"Rushing always works best","Details never matter","It is best to give up"],0,"Main Idea"]
]])});

let saved=JSON.parse(localStorage.getItem("sophiaRD")||"null")||{coins:0,stars:0,done:[],level:1,rewards:[],resume:null};
let S=Object.assign({coins:0,stars:0,done:[],level:1,rewards:[],resume:null},saved,{streak:0,correct:0,ind:0,guided:0,rereads:0,focus:0,mode:"read",story:0,chunk:0,q:0,locked:false});const $=x=>document.getElementById(x),screen=$("screen");function save(){localStorage.setItem("sophiaRD",JSON.stringify({coins:S.coins,stars:S.stars,done:S.done,level:S.level,rewards:S.rewards||[],resume:S.resume||null}))}
function checkpoint(stage){S.resume={stage:stage,mode:S.mode,story:S.story,chunk:S.chunk,q:S.q};save()}
function clearResume(){S.resume=null;save()}
function gameMenu(){save();screen.innerHTML='<section class="card center"><div class="gameHero"><div class="avatar">🕵️‍♀️</div><span class="rank">GAME SAVED ✓</span><h2>Detective Menu</h2><div class="companion">🐱🎀</div></div><p>Your coins, stars, completed cases, rank, rewards, and current mission checkpoint are saved on this iPad.</p>'+(S.resume?'<button class="btn" onclick="resumeGame()">▶️ Continue Current Mission</button>':'')+'<button class="btn alt" onclick="home()">🏠 Main Menu</button><button class="btn alt" onclick="parent()">🏆 Detective HQ</button></section>'}
function resumeGame(){if(!S.resume)return home();Object.assign(S,S.resume);if(S.resume.stage==="question")question();else if(S.resume.stage==="introQ")introQ();else chunk()}
function stats(){$("coins").textContent=S.coins;$("streak").textContent=S.streak;$("stars").textContent=S.stars;save()}function home(){save();screen.innerHTML='<section class="card center"><div class="gameHero"><div class="avatar">🕵️‍♀️</div><span class="rank">🌸 DETECTIVE SOPHIA • ROOKIE RANK</span><h1>✨ Sophia\'s Reading Detective ✨</h1><h2>🏰 Mystery Academy</h2><div class="missionBanner">🔎 30 MYSTERY CASES • ⭐ RANK UP • 🎀 COLLECT REWARDS</div><div class="gameNav"><div class="navTile"><span>🗺️</span>Mission Map</div><div class="navTile"><span>🎁</span>Rewards</div><div class="navTile"><span>🏆</span>Detective Rank</div></div><div class="companion">🐱🎀</div></div><p>Welcome back, <b>Detective Sophia!</b> Your anime mystery adventure is waiting. Solve cases, collect stars, earn Sophia Coins, and rise through the Detective Academy ranks while training your brain to <b>read, picture, understand, and remember</b>.</p><div class="tip">⭐ You do not need to memorize every word. Your job is to understand what happened.</div><p><b>🗺️ Mission Map:</b> '+S.done.length+' of '+stories.length+' stories completed this round.</p><button class="btn" onclick="modes()">🎮 START ADVENTURE ✨</button><button class="btn alt" onclick="parent()">👨‍👩‍👧 🏆 Detective HQ • Mom & Dad</button></section>'}function modes(){screen.innerHTML='<section class="card center"><div class="hero">🐱🔎</div><h2>Choose Your Mission</h2><div class="grid"><button class="mode" onclick="start(\'read\')"><div class="icon">📖</div><b>Reading Detective</b>Read, stop, picture it, and remember it.</button><button class="mode" onclick="start(\'listen\')"><div class="icon">🎧</div><b>Listening Detective</b>Hear one clue at a time and hold it in memory.</button></div></section>'}function pick(){let avail=stories.map((_,i)=>i).filter(i=>!S.done.includes(i));if(!avail.length){S.done=[];avail=stories.map((_,i)=>i);S.level++;save()}return avail[Math.floor(Math.random()*avail.length)]}function start(m){Object.assign(S,{mode:m,story:pick(),chunk:0,q:0,correct:0,ind:0,guided:0,rereads:0,focus:0,streak:0});checkpoint("chunk");stats();chunk()}function prog(n){return '<div class="progress"><div style="width:'+n+'%"></div></div>'}function chunk(){checkpoint("chunk");let t=stories[S.story][1][S.chunk],p=S.chunk/stories[S.story][1].length*45;if(S.mode==="read")screen.innerHTML='<section class="card">'+prog(p)+'<div class="center"><span class="questTag">📖 STORY CLUE '+(S.chunk+1)+'</span><div class="companion">🕵️‍♀️🐱</div></div><h2 class="center">Detective Eyes On!</h2><p class="center">Slow down. Read for meaning, not speed.</p><div class="read">'+t+'</div><div class="focus">🧠 <b>Make a movie in your head.</b><br>Who? What happened? Where?</div><button class="btn" onclick="process()">Hide the Words 👀</button></section>';else screen.innerHTML='<section class="card center">'+prog(p)+'<div class="icon">🎧</div><h2>Listening Detective</h2><div class="focus">👂 LISTEN → 🛑 STOP → 🧠 PICTURE → 🗣️ RETELL</div><button class="btn" onclick="speak()">🔊 Hear This Clue</button><button class="btn alt" onclick="process()">I Heard It — I\'m Ready 🧠</button></section>'}function speak(){if(!speechSynthesis)return alert("Speech is not available here.");speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(stories[S.story][1][S.chunk]);u.rate=.82;speechSynthesis.speak(u)}function process(){screen.innerHTML='<section class="card center"><div class="companion">🕵️‍♀️💭🐱</div><span class="rank">MEMORY POWER-UP</span><h2>STOP & THINK!</h2><div class="focus">👤 Who was there?<br>🎬 What happened?<br>📍 Where were they?<br>⭐ What is one important thing?</div><h2>🗣️ Say it in your own words.</h2><button class="btn" onclick="confidence()">I Told It Back! 🔎</button></section>'}function confidence(){screen.innerHTML='<section class="card center"><div class="hero">🦊</div><h2>How Did That Stick?</h2><div class="grid"><button class="mode" onclick="conf(1)">😎<b>I Know It!</b></button><button class="mode" onclick="conf(2)">🤔<b>I Think I Know</b></button></div><button class="btn alt" onclick="conf(0)">🔄 I Need It Again</button></section>'}function conf(x){if(!x){S.rereads++;S.coins++;stats();reward("🐼🌸","Smart Detective!","Good readers notice when something did not stick. +1 Sophia Coin!");setTimeout(()=>{closeReward();chunk()},1300)}else focus()}function focus(){let a=["What was the MOST important thing that happened?","Who or what was this part mostly about?","What picture can you still see in your mind?","What happened first?"];screen.innerHTML='<section class="card center"><div class="companion">🕵️‍♀️⚡🐱</div><span class="rank">DETECTIVE CHECKPOINT</span><h2>FOCUS CHECK!</h2><div class="focus"><h2>'+a[S.chunk%4]+'</h2></div><p>Say your answer out loud.</p><button class="btn" onclick="focusWin()">I Answered It! ⚡</button><button class="btn alt" onclick="forgot()">I Can\'t Remember Yet</button></section>'}function focusWin(){S.focus++;S.coins+=2;S.streak++;stats();nextChunk()}function forgot(){S.rereads++;S.streak=0;stats();reward("🦊💖","Detective Reset!","You noticed the clue slipped away. Let\'s catch it this time!");setTimeout(()=>{closeReward();chunk()},1400)}function nextChunk(){S.chunk++;if(S.chunk<stories[S.story][1].length){if(S.chunk===2){S.coins+=3;stats();reward("🐰🌸✨","Story Streak!","You\'re building the story one piece at a time! +3 coins");setTimeout(()=>{closeReward();chunk()},1400)}else chunk()}else introQ()}function introQ(){checkpoint("introQ");screen.innerHTML='<section class="card center"><div class="hero">🕵️‍♀️✨</div><h2>The Story Is Hidden!</h2><p>Now let\'s see what your detective brain stored.</p><div class="tip">🧠 Try answering from memory first.</div><button class="btn" onclick="question()">Solve the Mystery! 🔎</button></section>'}function question(){checkpoint("question");let q=stories[S.story][2][S.q];screen.innerHTML='<section class="card">'+prog(50+(S.q+1)/5*45)+'<div class="center"><div class="icon">🔎</div><small>'+q[3]+'</small><h2>'+q[0]+'</h2></div><div class="answers">'+q[1].map((x,i)=>'<button id="a'+i+'" class="answer" onclick="answer('+i+')">'+String.fromCharCode(65+i)+'. '+x+'</button>').join("")+'</div></section>';S.locked=false}function answer(x){if(S.locked)return;S.locked=true;let q=stories[S.story][2][S.q];if(x===q[2]){$("a"+x).classList.add("good");S.correct++;S.ind++;S.streak++;S.coins+=3;if(S.streak>=3)S.coins+=2;stats();setTimeout(advance,650)}else{$("a"+x).classList.add("bad");S.streak=0;stats();setTimeout(guided,650)}}function guided(){S.rereads++;screen.innerHTML='<section class="card center"><div class="hero">🐼🔎</div><h2>Detective Clue!</h2><p>That\'s okay. Let\'s train your brain to recover the information.</p><div class="tip">🔎 Reread with a purpose: look specifically for the clue that answers the question.</div><button class="btn" onclick="review()">Find the Clue</button></section>'}function review(){screen.innerHTML='<section class="card"><h2 class="center">🔎 Clue Hunt</h2><div class="read">'+stories[S.story][1].join("<br><br>")+'</div><button class="btn" onclick="retry()">I Found My Clue!</button></section>'}function retry(){let q=stories[S.story][2][S.q];screen.innerHTML='<section class="card"><h2 class="center">⭐ Try Again</h2><p class="center">'+q[0]+'</p><div class="answers">'+q[1].map((x,i)=>'<button class="answer" onclick="guidedAnswer('+i+')">'+String.fromCharCode(65+i)+'. '+x+'</button>').join("")+'</div></section>'}function guidedAnswer(x){let q=stories[S.story][2][S.q];if(x===q[2]){S.correct++;S.guided++;S.stars++;S.coins+=2;stats();reward("🦊⭐🌸","COMEBACK STAR!","You went back, found the clue, and fixed your answer!")}else reward("🐰💗","Keep Training!","The answer was “"+q[1][q[2]]+".” We\'ll practice this skill again.");setTimeout(()=>{closeReward();advance()},1600)}function advance(){S.q++;S.q<5?question():finish()}function finish(){clearResume();if(!S.done.includes(S.story))S.done.push(S.story);S.coins+=10;S.stars++;stats();reward("🕵️‍♀️🏆🌸✨","MISSION COMPLETE!","+10 Sophia Coins and +1 Star! New case progress saved.");setTimeout(()=>{closeReward();results()},1900)}function results(){let pct=Math.round(S.correct/5*100);screen.innerHTML='<section class="card center"><div class="gameHero"><div class="avatar">🕵️‍♀️</div><span class="rank">🏆 CASE SOLVED!</span><h1>Amazing Work, Sophia!</h1><div class="companion">🐱🎀✨</div></div><div class="reports"><div class="report"><strong>'+pct+'%</strong>Comprehension</div><div class="report"><strong>'+S.ind+'</strong>Independent</div><div class="report"><strong>'+S.guided+'</strong>Comebacks</div><div class="report"><strong>'+S.rereads+'</strong>Rereads</div><div class="report"><strong>'+S.focus+'</strong>Focus Checks</div><div class="report"><strong>'+S.coins+'</strong>Sophia Coins</div></div><div class="tip">🌟 Needing to reread is not losing. Good readers notice when something did not stick and go back for it.</div><button class="btn" onclick="modes()">Play Another Mission 🌸</button><button class="btn alt" onclick="parent()">👨‍👩‍👧 Parent Area</button></section>'}function parent(){screen.innerHTML='<section class="card"><h2>👨‍👩‍👧 Parent Area</h2><p><b>Learning loop:</b> READ/HEAR → STOP → PICTURE → RETELL → RECALL → PROVE IT.</p><div class="reports"><div class="report"><strong>'+S.done.length+'/'+stories.length+'</strong>Cases this round</div><div class="report"><strong>'+S.level+'</strong>Story cycle</div><div class="report"><strong>'+S.coins+'</strong>Saved coins</div><div class="report"><strong>'+S.stars+'</strong>Saved stars</div></div><div class="tip">Reading and Listening modes stay separate so you can observe differences in visual versus auditory processing. Results are learning observations, not diagnostic results.</div><button class="btn" onclick="home()">Back</button></section>'}function reward(c,t,x){$("rchar").textContent=c;$("rtitle").textContent=t;$("rtext").textContent=x;$("overlay").classList.remove("hidden")}function closeReward(){$("overlay").classList.add("hidden")}window.addEventListener("pagehide",save);window.addEventListener("beforeunload",save);stats();home();
</script></body></html>
